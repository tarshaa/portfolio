name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the approved portfolio
        uses: actions/checkout@v4
        with:
          repository: tarshaa/work-website
          ref: 0e4e2c2eec83fa30aaa1f3833c4518c726f66466
          path: site
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Preserve existing media and project links
        run: |
          cp -R public/. site/
          python3 - <<'PY'
          from pathlib import Path
          aliases = {
              "techniques": "/techniques.html",
              "frontier-ai-models": "/models.html",
              "print": "/physical.html",
              "creative-context-cli": "/creative-context-cli.html",
              "trailer-technologist": "/film.html",
              "product-innovation": "/feature-demos.html",
              "design-and-marketing": "/",
              "game": "/",
          }
          for old, target in aliases.items():
              page = Path("site") / old / "index.html"
              page.parent.mkdir(parents=True, exist_ok=True)
              page.write_text(
                  '<!doctype html><html lang="en"><head><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width, initial-scale=1">'
                  f'<meta http-equiv="refresh" content="0;url={target}">'
                  f'<link rel="canonical" href="https://tarshaakrishnaraj.com{target}">'
                  '<title>Tarshaa Krishnaraj — Portfolio</title></head>'
                  f'<body><a href="{target}">Continue to the portfolio</a></body></html>'
              )
          assert Path("site/images/flora-series-a.gif").is_file()
          assert Path("site/assets/elements-cover-loop.gif").is_file()
          assert "model-eval-loops-31" in Path("site/index.html").read_text()
          for model in ("omni", "recraft", "opus"):
              assert Path(f"site/assets/eval-{model}-loop-v31.gif").is_file()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
