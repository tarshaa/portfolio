name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the approved portfolio
        uses: actions/checkout@v4
        with:
          repository: tarshaa/work-website
          ref: c275e2a4fc64b31c823945180822ee235a8bb2d8
          path: approved
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Assemble the approved site without reducing media quality
        run: |
          python3 - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path
          source, site = Path("approved"), Path("site")
          site.mkdir()
          for name in json.loads((source / "site-files.json").read_text()):
              src, dst = source / name, site / name
              assert src.is_file(), f"Missing approved asset: {name}"
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          subprocess.run(["python3", str(site / "assemble-media.py")], check=True)
          shutil.rmtree(site / "media-parts")
          (site / "assemble-media.py").unlink()
          (site / "media-parts.json").unlink()
          # Keep previously shared media URLs without overwriting approved files.
          for src in Path("public").rglob("*"):
              dst = site / src.relative_to("public")
              if src.is_file() and not dst.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          aliases = {
              "techniques": "/techniques.html",
              "frontier-ai-models": "/models.html",
              "print": "/physical.html",
              "creative-context-cli": "/creative-context-cli.html",
              "trailer-technologist": "/film.html",
              "product-innovation": "/feature-demos.html",
              "design-and-marketing": "/",
              "game": "/",
          }
          for old, target in aliases.items():
              page = site / old / "index.html"
              page.parent.mkdir(parents=True, exist_ok=True)
              page.write_text(
                  '<!doctype html><html lang="en"><head><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width, initial-scale=1">'
                  f'<meta http-equiv="refresh" content="0;url={target}">'
                  f'<link rel="canonical" href="https://tarshaakrishnaraj.com{target}">'
                  '<title>Tarshaa Krishnaraj — Portfolio</title></head>'
                  f'<body><a href="{target}">Continue to the portfolio</a></body></html>'
              )
          assert "preview.js" in (site / "index.html").read_text()
          assert (site / "operating-manual.html").is_file()
          for name in ("image-editor-loop-1080.gif", "creative-directions-loop-1080.gif", "fauna-cover-large-4k-loop.gif"):
              assert (site / "assets" / name).stat().st_size > 1000000
          for i in range(1, 9):
              assert (site / "assets" / f"evaluation-study-{i}.png").is_file()
          size = sum(p.stat().st_size for p in site.rglob("*") if p.is_file())
          assert size < 1000000000, f"Site exceeds Pages size limit: {size}"
          print(f"Approved site: {size:,} bytes")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
